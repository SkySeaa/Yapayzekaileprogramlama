<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hesap Oluştur | Neon Ekosistemi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 25%, rgba(88, 28, 135, 0.35), transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(6, 182, 212, 0.25), transparent 48%),
        #05060f;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(16, 18, 36, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.32);
      border-radius: 22px;
      padding: 36px 32px;
      box-shadow:
        0 0 35px rgba(139, 92, 246, 0.14),
        0 24px 60px rgba(0, 0, 0, 0.7);
    }

    .icon-badge {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(56, 189, 248, 0.25));
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
      color: #38bdf8;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header h1 span {
      color: #38bdf8;
    }

    .header p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 11px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(24, 27, 48, 0.85);
      color: #f8fafc;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    input.with-eye {
      padding-right: 44px;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .eye-btn:hover {
      color: #38bdf8;
    }

    .error-text {
      display: block;
      min-height: 16px;
      margin-top: 5px;
      font-size: 0.79rem;
      color: #fb7185;
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      background: linear-gradient(90deg, #9333ea, #0284c7);
      box-shadow: 0 0 18px rgba(147, 51, 234, 0.4), 0 0 24px rgba(2, 132, 199, 0.25);
      transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow:
        0 0 24px rgba(168, 85, 247, 0.75),
        0 0 36px rgba(56, 189, 248, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .status-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.86rem;
      display: none;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
    }

    .footer-link {
      margin-top: 22px;
      text-align: center;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .footer-link a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .footer-link a:hover {
      color: #c084fc;
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.7);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
    </div>

    <div class="header">
      <h1>Hesap <span>Oluştur</span></h1>
      <p>Ayrıcalıklı neon ekosistemine katılın</p>
    </div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="fullname">Ad Soyad</label>
        <div class="input-box">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="fullname" placeholder="Ahmet Yılmaz" />
        </div>
        <small class="error-text" id="fullnameError"></small>
      </div>

      <div class="form-group">
        <label for="email">E-posta Adresi</label>
        <div class="input-box">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </span>
          <input type="email" id="email" placeholder="adiniz@sirket.com" />
        </div>
        <small class="error-text" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <div class="input-box">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="password" class="with-eye" placeholder="En az 6 karakter" />
          <button type="button" class="eye-btn" id="togglePass1" aria-label="Şifreyi göster/gizle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <small class="error-text" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Şifre Tekrar</label>
        <div class="input-box">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="confirmPassword" class="with-eye" placeholder="Şifrenizi tekrar girin" />
          <button type="button" class="eye-btn" id="togglePass2" aria-label="Şifre tekrarını göster/gizle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <small class="error-text" id="confirmPasswordError"></small>
      </div>

      <button type="submit" class="submit-btn">Üye Ol</button>
      <div class="status-msg" id="signupStatus"></div>
    </form>

    <div class="footer-link">
      Zaten hesabınız var mı? <a href="index.html">Giriş sayfasına dön</a>
    </div>
  </main>

  <script>
    const form = document.getElementById("signupForm");
    const fullname = document.getElementById("fullname");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const fullnameError = document.getElementById("fullnameError");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const confirmPasswordError = document.getElementById("confirmPasswordError");
    const signupStatus = document.getElementById("signupStatus");

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function toggleVisibility(inputEl) {
      inputEl.type = inputEl.type === "password" ? "text" : "password";
    }

    document.getElementById("togglePass1").addEventListener("click", () => toggleVisibility(password));
    document.getElementById("togglePass2").addEventListener("click", () => toggleVisibility(confirmPassword));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      fullnameError.textContent = "";
      emailError.textContent = "";
      passwordError.textContent = "";
      confirmPasswordError.textContent = "";
      signupStatus.className = "status-msg";
      signupStatus.textContent = "";

      let valid = true;

      if (!fullname.value.trim()) {
        fullnameError.textContent = "Ad Soyad alanı boş bırakılamaz.";
        valid = false;
      }

      if (!email.value.trim()) {
        emailError.textContent = "E-posta adresi boş bırakılamaz.";
        valid = false;
      } else if (!emailRegex.test(email.value.trim())) {
        emailError.textContent = "Geçerli bir e-posta adresi girin.";
        valid = false;
      }

      if (!password.value) {
        passwordError.textContent = "Şifre alanı boş bırakılamaz.";
        valid = false;
      } else if (password.value.length < 6) {
        passwordError.textContent = "Şifre en az 6 karakter olmalıdır.";
        valid = false;
      }

      if (!confirmPassword.value) {
        confirmPasswordError.textContent = "Şifre tekrar alanı boş bırakılamaz.";
        valid = false;
      } else if (password.value !== confirmPassword.value) {
        confirmPasswordError.textContent = "Şifreler eşleşmiyor.";
        valid = false;
      }

      if (valid) {
        signupStatus.classList.add("success");
        signupStatus.textContent = `${fullname.value.trim()} için kayıt başarıyla oluşturuldu!`;
      }
    });
  </script>
</body>
</html>
