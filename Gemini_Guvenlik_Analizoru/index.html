<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | NeonAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070712;
            --card-bg: rgba(18, 18, 38, 0.7);
            --card-border: rgba(138, 75, 255, 0.25);
            --primary-neon: #8a2be2;
            --secondary-neon: #00d2ff;
            --accent-glow: rgba(138, 43, 226, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #9aa0b8;
            --input-bg: rgba(26, 26, 56, 0.6);
            --input-border: rgba(120, 120, 180, 0.25);
            --error-color: #ff3860;
            --success-color: #00e676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Neon Background Effects */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: radial-gradient(circle, #7928ca 0%, rgba(121, 40, 202, 0) 70%);
            top: -80px;
            left: -80px;
        }

        .glow-2 {
            background: radial-gradient(circle, #0070f3 0%, rgba(0, 112, 243, 0) 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -5s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
            100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.65; }
        }

        /* Container Card */
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 42px 38px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(138, 43, 226, 0.15);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .auth-card:hover {
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                        0 0 45px rgba(0, 210, 255, 0.18),
                        0 0 25px rgba(138, 43, 226, 0.25);
        }

        .card-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.25), rgba(0, 210, 255, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.35);
            margin-bottom: 18px;
        }

        .brand-logo svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: url(#brandGradient);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg.field-icon {
            position: absolute;
            left: 15px;
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 0 46px 0 44px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #636b85;
            font-size: 13.5px;
        }

        .form-input:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.35), inset 0 0 8px rgba(0, 210, 255, 0.1);
            background: rgba(30, 30, 65, 0.85);
        }

        .form-input:focus ~ svg.field-icon {
            stroke: var(--secondary-neon);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--secondary-neon);
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Error States */
        .error-message {
            font-size: 12px;
            color: var(--error-color);
            margin-top: 5px;
            min-height: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
        }

        .error-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-input.input-error {
            border-color: var(--error-color);
            box-shadow: 0 0 10px rgba(255, 56, 96, 0.35);
        }

        /* Form Actions & Links */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 22px 0;
            font-size: 13px;
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            color: var(--text-secondary);
        }

        .remember-wrap input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
        }

        .remember-wrap input[type="checkbox"]:checked {
            background: var(--primary-neon);
            border-color: var(--primary-neon);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .remember-wrap input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .neon-link {
            color: var(--secondary-neon);
            text-decoration: none;
            font-weight: 500;
            transition: text-shadow 0.3s ease, color 0.3s ease;
        }

        .neon-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px var(--secondary-neon), 0 0 16px var(--secondary-neon);
        }

        /* Neon Button */
        .btn-neon {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 50%, #0070f3 100%);
            background-size: 200% auto;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4),
                        0 0 35px rgba(0, 112, 243, 0.25);
            transition: all 0.4s ease;
        }

        .btn-neon:hover {
            background-position: right center;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.8),
                        0 0 50px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-neon:active {
            transform: translateY(1px);
        }

        .card-footer {
            margin-top: 26px;
            text-align: center;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 18, 40, 0.95);
            border: 1px solid var(--secondary-neon);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 14px 24px;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d2ff"/>
                <stop offset="100%" stop-color="#8a2be2"/>
            </linearGradient>
        </defs>
    </svg>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-card">
        <div class="card-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1>Giriş Yap</h1>
            <p>Neon portalına erişmek için bilgilerinizi girin</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">E-posta Adresi</label>
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="email" class="form-input" placeholder="adiniz@sirket.com" autocomplete="email">
                </div>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Şifre</label>
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Şifre görünürlüğü">
                        <svg class="eye-open" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-options">
                <label class="remember-wrap">
                    <input type="checkbox" id="rememberMe">
                    <span>Beni Hatırla</span>
                </label>
                <a href="forgot_password.html" class="neon-link">Şifremi Unuttum?</a>
            </div>

            <button type="submit" class="btn-neon">
                <span>Giriş Yap</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="card-footer">
            Hesabınız yok mu? <a href="signup.html" class="neon-link">Hemen Kayıt Ol</a>
        </div>
    </div>

    <div class="toast" id="toastMessage"></div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeOpen = togglePasswordBtn.querySelector('.eye-open');
        const eyeClosed = togglePasswordBtn.querySelector('.eye-closed');
        const toast = document.getElementById('toastMessage');

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
        });

        // Email regex
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(input, errorElement, message) {
            input.classList.add('input-error');
            errorElement.textContent = message;
            errorElement.classList.add('visible');
        }

        function clearError(input, errorElement) {
            input.classList.remove('input-error');
            errorElement.textContent = '';
            errorElement.classList.remove('visible');
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        emailInput.addEventListener('input', () => clearError(emailInput, emailError));
        passwordInput.addEventListener('input', () => clearError(passwordInput, passwordError));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            const emailVal = emailInput.value.trim();
            const passwordVal = passwordInput.value;

            if (!emailVal) {
                showError(emailInput, emailError, 'Lütfen e-posta adresinizi girin.');
                isValid = false;
            } else if (!isValidEmail(emailVal)) {
                showError(emailInput, emailError, 'Geçerli bir e-posta adresi girin.');
                isValid = false;
            } else {
                clearError(emailInput, emailError);
            }

            if (!passwordVal) {
                showError(passwordInput, passwordError, 'Lütfen şifrenizi girin.');
                isValid = false;
            } else if (passwordVal.length < 6) {
                showError(passwordInput, passwordError, 'Şifre en az 6 karakter olmalıdır.');
                isValid = false;
            } else {
                clearError(passwordInput, passwordError);
            }

            if (isValid) {
                showToast('🚀 Giriş başarılı! Yönlendiriliyorsunuz...');
                setTimeout(() => {
                    form.reset();
                }, 2000);
            }
        });
    </script>
</body>
</html>
