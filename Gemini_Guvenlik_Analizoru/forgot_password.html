<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | NeonAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070712;
            --card-bg: rgba(18, 18, 38, 0.7);
            --card-border: rgba(138, 75, 255, 0.25);
            --primary-neon: #8a2be2;
            --secondary-neon: #00d2ff;
            --accent-glow: rgba(138, 43, 226, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #9aa0b8;
            --input-bg: rgba(26, 26, 56, 0.6);
            --input-border: rgba(120, 120, 180, 0.25);
            --error-color: #ff3860;
            --success-color: #00e676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: radial-gradient(circle, #0070f3 0%, rgba(0, 112, 243, 0) 70%);
            top: -80px;
            right: -80px;
        }

        .glow-2 {
            background: radial-gradient(circle, #7928ca 0%, rgba(121, 40, 202, 0) 70%);
            bottom: -80px;
            left: -80px;
            animation-delay: -5s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
            100% { transform: scale(1.15) translate(-30px, 20px); opacity: 0.65; }
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 42px 38px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(138, 43, 226, 0.15);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .auth-card:hover {
            border-color: rgba(138, 43, 226, 0.45);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                        0 0 45px rgba(138, 43, 226, 0.25),
                        0 0 25px rgba(0, 210, 255, 0.2);
        }

        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(138, 43, 226, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.35);
            margin-bottom: 18px;
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            stroke: var(--secondary-neon);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-header h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg.field-icon {
            position: absolute;
            left: 15px;
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 0 16px 0 44px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #636b85;
            font-size: 13.5px;
        }

        .form-input:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.35), inset 0 0 8px rgba(0, 210, 255, 0.1);
            background: rgba(30, 30, 65, 0.85);
        }

        .form-input:focus ~ svg.field-icon {
            stroke: var(--secondary-neon);
        }

        .error-message {
            font-size: 12px;
            color: var(--error-color);
            margin-top: 5px;
            min-height: 16px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s ease;
        }

        .error-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-input.input-error {
            border-color: var(--error-color);
            box-shadow: 0 0 10px rgba(255, 56, 96, 0.35);
        }

        .btn-neon {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0070f3 0%, #4b0082 50%, #8a2be2 100%);
            background-size: 200% auto;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 112, 243, 0.4),
                        0 0 35px rgba(138, 43, 226, 0.25);
            transition: all 0.4s ease;
        }

        .btn-neon:hover {
            background-position: right center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.8),
                        0 0 50px rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }

        .btn-neon:active {
            transform: translateY(1px);
        }

        .card-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .neon-link {
            color: var(--secondary-neon);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: text-shadow 0.3s ease, color 0.3s ease;
        }

        .neon-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px var(--secondary-neon), 0 0 16px var(--secondary-neon);
        }

        /* Success Card State */
        .info-box {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #d1fae5;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
        }

        .info-box.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-card">
        <div class="card-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                </svg>
            </div>
            <h1>Şifre Sıfırlama</h1>
            <p>Hesabınıza kayıtlı e-posta adresini girin, şifre yenileme bağlantısını gönderelim.</p>
        </div>

        <div class="info-box" id="infoBox">
            ✨ Sıfırlama bağlantısı e-posta adresinize gönderildi! Gelen kutunuzu (ve spam klasörünü) kontrol ediniz.
        </div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="resetEmail">Kayıtlı E-posta Adresi</label>
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="resetEmail" class="form-input" placeholder="adiniz@sirket.com" autocomplete="email">
                </div>
                <div class="error-message" id="resetEmailError"></div>
            </div>

            <button type="submit" class="btn-neon" id="submitBtn">
                <span>Sıfırlama Bağlantısı Gönder</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>

        <div class="card-footer">
            <a href="index.html" class="neon-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Giriş Sayfasına Dön
            </a>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const resetEmail = document.getElementById('resetEmail');
        const resetEmailError = document.getElementById('resetEmailError');
        const infoBox = document.getElementById('infoBox');
        const submitBtn = document.getElementById('submitBtn');

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(input, errorElement, message) {
            input.classList.add('input-error');
            errorElement.textContent = message;
            errorElement.classList.add('visible');
        }

        function clearError(input, errorElement) {
            input.classList.remove('input-error');
            errorElement.textContent = '';
            errorElement.classList.remove('visible');
        }

        resetEmail.addEventListener('input', () => {
            clearError(resetEmail, resetEmailError);
        });

        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailVal = resetEmail.value.trim();

            if (!emailVal) {
                showError(resetEmail, resetEmailError, 'Lütfen e-posta adresinizi girin.');
                return;
            }

            if (!isValidEmail(emailVal)) {
                showError(resetEmail, resetEmailError, 'Geçerli bir e-posta adresi girin.');
                return;
            }

            clearError(resetEmail, resetEmailError);

            // Simüle edilmiş gönderim
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            submitBtn.querySelector('span').textContent = 'Gönderiliyor...';

            setTimeout(() => {
                infoBox.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.querySelector('span').textContent = 'Tekrar Gönder';
                resetEmail.value = '';
            }, 1200);
        });
    </script>
</body>
</html>
